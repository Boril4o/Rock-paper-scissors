<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Rock paper scissors</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <footer id="name">
        <h1>Rock paper scissors by Boris</h1>
    </footer>

    <main>
        <div class="game-options">
            <section class="min-speed">
                <label>Min speed</label>
                <input type="number" value="50"/>
            </section>
            <section class="max-speed">
                <label>Max speed</label>
                <input type="number" value="100"/>
            </section>
            <section class="spawn-amount">
                <label>Spawn amount</label>
                <input type="number" value="10"/>
            </section>
            <button class="start-game-but">Start game</button>
        </div>
        <div id="play-container"></div>
    </main>
</body>
<script type="module" src="script.js"></script>
</html>
